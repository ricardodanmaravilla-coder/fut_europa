name: Validate Fut Europa Line-Aware ML

on:
  workflow_dispatch:
  push:
    paths:
      - 'modules/ml_europa.py'
      - 'modules/montecarlo_europa.py'
      - 'modules/odds_europa.py'
      - 'weekly_entrypoint.py'
      - 'Dockerfile'
      - '.github/workflows/validate-line-aware.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install numpy pandas scikit-learn requests pyarrow duckdb fastapi uvicorn
      - name: Compile changed modules
        run: python -m py_compile modules/ml_europa.py modules/montecarlo_europa.py modules/odds_europa.py weekly_entrypoint.py web_app.py web_app_v2.py
      - name: Train and verify dynamic lines and weekly window
        run: |
          python - <<'PY'
          from datetime import date
          from unittest.mock import patch
          import pandas as pd
          from modules.ml_europa import PredictorMLEuropa
          from modules.montecarlo_europa import simular_partido_europa
          import weekly_entrypoint as weekly

          path='data/historico_premier.csv'
          df=pd.read_csv(path)
          model=PredictorMLEuropa()
          assert model.entrenar(df), 'ML training failed'
          teams=sorted(set(df['Local'].dropna()).intersection(set(df['Visitante'].dropna())))
          assert len(teams)>=2
          a,b=teams[0],teams[1]
          lines={'goles':3.5,'corners':10.5,'tarjetas':5.5}
          odds={'1':2.2,'X':3.3,'2':3.1,'_lineas':lines}
          pred=model.predecir_mercados_completos(a,b,cuotas_1x2=odds,lineas_casino=lines)
          assert pred['Meta']['line_aware'] is True
          assert pred['Meta']['lineas_modeladas']['goles']==3.5
          assert 'Over 3.5' in pred['Goles_Over_Under']
          assert 'Over 10.5 Corners' in pred['Corners_Totales']
          assert 'Over 5.5 Tarjetas' in pred['Tarjetas_Totales']
          mc=simular_partido_europa(a,b,df,1500,1500,lineas_casino=lines)
          assert 'Over 3.5 Goles' in mc['Lineas_Casino']['goles']
          assert 'Over 10.5 Corners' in mc['Lineas_Casino']['corners']
          assert 'Over 5.5 Tarjetas' in mc['Lineas_Casino']['tarjetas']

          start,end=weekly._week_window(date(2026,9,4))
          assert start.isoformat()=='2026-09-04'
          assert end.isoformat()=='2026-09-06'
          start2,end2=weekly._week_window(date(2026,9,6))
          assert start2==end2==date(2026,9,6)

          # Verify explicit from/to API-Football query and that >15 fixtures are retained.
          fake_response=[]
          for i in range(20):
              fake_response.append({
                  'fixture': {'id': 1000+i, 'date': '2026-09-05T18:00:00-06:00'},
                  'teams': {'home': {'name': f'Home {i}'}, 'away': {'name': f'Away {i}'}}
              })
          class Resp:
              status_code=200
              def json(self): return {'response': fake_response}
          captured={}
          def fake_get(url, headers=None, params=None, timeout=None):
              captured['params']=params
              return Resp()
          with patch.object(weekly.core, 'API_KEY', 'test-key'), patch.object(weekly.requests, 'get', side_effect=fake_get):
              got=weekly._api_sports_week(39, start, end)
          assert len(got)==20, len(got)
          assert captured['params']['from']=='2026-09-04'
          assert captured['params']['to']=='2026-09-06'
          assert captured['params']['timezone']=='America/Mexico_City'
          assert 'next' not in captured['params']

          print('OK line-aware training rows:', pred['Meta']['train_rows_line_aware'])
          print('OK weekly Mexico City window:', start, end, 'fixtures:', len(got))
          PY
