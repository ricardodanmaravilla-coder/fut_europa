name: Actualizar Historicos y Validar Fut Europa

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 2,5'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar codigo
        run: python -m py_compile app_europa.py generar_historicos.py build_parquet_store.py enriquecer_statsbomb.py backtest_europa_temporal.py modules/*.py

      - name: Generar historicos gratuitos
        run: python generar_historicos.py

      - name: Construir capa Parquet DuckDB
        run: python build_parquet_store.py

      - name: Validar historicos, Parquet y motores
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          from modules.data_store import cargar_historico, validar_paridad
          from modules.elo_europa import SistemaEloEuropa
          from modules.ml_europa import PredictorMLEuropa
          from modules.montecarlo_europa import simular_partido_europa

          files = [
              'data/historico_premier.csv', 'data/historico_laliga.csv',
              'data/historico_seriea.csv', 'data/historico_bundesliga.csv',
              'data/historico_ligue1.csv'
          ]
          total = 0
          required = {
              'Fecha','Local','Visitante','Goles_Local','Goles_Visita',
              'Corners_Local','Corners_Visita','Tarjetas_Local','Tarjetas_Visita',
              'xG_Local','xG_Visita','xG_Proxy_Local','xG_Proxy_Visita',
              'TirosGol_Local','TirosGol_Visita',
              'Cuota_1','Cuota_X','Cuota_2','Cuota_Over25','Cuota_Under25',
              'Apertura_1','Apertura_X','Apertura_2','Cierre_1','Cierre_X','Cierre_2',
              'P_Apertura_1','P_Apertura_X','P_Apertura_2',
              'P_Cierre_1','P_Cierre_X','P_Cierre_2',
              'Movimiento_1_pp','Movimiento_X_pp','Movimiento_2_pp'
          }
          for path in files:
              assert os.path.exists(path), path
              parity = validar_paridad(path)
              assert parity.get('ok'), (path, parity)
              df = cargar_historico(path)
              assert len(df) >= 150, (path, len(df))
              assert required.issubset(df.columns), (path, required-set(df.columns))
              assert df[['Apertura_1','Apertura_X','Apertura_2']].notna().all(axis=1).sum() >= 100, path
              assert df[['Cierre_1','Cierre_X','Cierre_2']].notna().all(axis=1).sum() >= 100, path
              total += len(df)
          df = cargar_historico(files[0])
          elo = SistemaEloEuropa().actualizar_ratings(df)
          assert not elo.empty
          ml = PredictorMLEuropa(); assert ml.entrenar(df); assert ml.n_train >= 1000
          assert 0.25 <= ml.market_model_weight <= 1.0
          assert 0.7 <= ml.temp_1x2 <= 2.0
          h = df.iloc[-1]
          odds = {'1':h.get('Apertura_1'),'X':h.get('Apertura_X'),'2':h.get('Apertura_2')}
          p = ml.predecir_mercados_completos(h['Local'], h['Visitante'], cuotas_1x2=odds)
          assert p.get('Meta', {}).get('pregame_only') is True
          s = sum(p['Resultado_1X2'].values())
          assert 99.0 <= s <= 101.0, s
          out = simular_partido_europa(h['Local'], h['Visitante'], df, 1500, 1500, n_simulaciones=3000)
          assert 'Resultado_1X2' in out
          assert total >= 3000, total
          print('historicos/parquet/motores OK', total, 'weight', ml.market_model_weight, 'temp', ml.temp_1x2)
          PY

      - name: Diagnostico temporal estricto
        env:
          FUT_BACKTEST_FAST: '1'
          FUT_BACKTEST_FAST_ROWS: '120'
        run: python backtest_europa_temporal.py

      - name: Probar arranque Streamlit
        run: |
          streamlit run app_europa.py --server.headless true --server.port 8501 > /tmp/fut_europa.log 2>&1 &
          PID=$!
          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/fut_europa.log; kill $PID || true; exit 1; fi
          kill $PID || true

      - name: Guardar historicos actualizados
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico_*.csv data/historico_*.parquet
          if git diff --cached --quiet; then
            echo "Sin cambios de datos"
          else
            git commit -m "data: actualizar históricos europeos CSV y Parquet"
            git push
          fi
