name: Actualizar Historicos y Datos de Futbol

on:
  schedule:
    - cron: '0 4 * * 2,5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Ejecutar script de generacion de historicos
      env:
        API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      run: |
        python generar_historicos.py
