name: Settle FUT Europa Picks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Settle pending FUT Europa picks
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 --max-time 180 \
            -X POST \
            https://fut-europa-767691786811.us-central1.run.app/api/settle
