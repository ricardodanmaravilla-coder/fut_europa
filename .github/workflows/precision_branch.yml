name: Precision Branch Validation

on:
  push:
    branches: [optimize/max-precision-v3]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile app_europa.py generar_historicos.py backtest_europa_temporal.py modules/*.py
      - run: python generar_historicos.py
      - run: python backtest_europa_temporal.py
      - name: Smoke Streamlit
        run: |
          streamlit run app_europa.py --server.headless true --server.port 8501 > /tmp/fut_europa.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then kill $PID || true; exit 0; fi
            sleep 1
          done
          cat /tmp/fut_europa.log
          kill $PID || true
          exit 1
