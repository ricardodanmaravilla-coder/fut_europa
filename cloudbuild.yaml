timeout: 3600s

options:
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fut-europa:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fut-europa:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - fut-europa
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fut-europa:latest
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --concurrency=4
      - --timeout=900
      - --set-secrets=API_SPORTS_KEY=api-sports-key:latest

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fut-europa:latest
